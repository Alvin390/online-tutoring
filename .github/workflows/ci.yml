name: CI

# Phase 13 / 01 D1. Replaces deploy.yml, which still deployed to Vercel and ran
# the handler suite without the Auth emulator or a project ID — authParity could
# not pass in CI (validated: every case failed on a verbatim replay).
#
# Jobs run in parallel where they share nothing. This workflow only TESTS.
# Uploading versions is Cloudflare Workers Builds' job (the repo is connected
# in the dashboard; its deploy command is `npx wrangler versions upload`, which
# routes no traffic). Promotion stays a deliberate human step:
#   npx wrangler versions deploy        (or one click in the Cloudflare dashboard)
# See docs/LAUNCH.md §0.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Read by scripts/postinstall.js — CI installs must not run the health check
  # and a full production build as a side effect of `npm ci`.
  CI: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run test:all

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Cache Firebase emulator JARs
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Security rules are the only control a client cannot bypass.
      - run: npx firebase-tools emulators:exec --project demo-online-tutoring --only firestore "npx vitest run --config vitest.rules.config.js"

  handlers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Cache Firebase emulator JARs
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # BOTH emulators and an explicit demo project. Without --project the Auth
      # emulator mints tokens for "demo-no-project", which the REST shim then
      # (correctly) rejects — see tests/handlers/authParity.test.js.
      - run: npx firebase-tools emulators:exec --project demo-online-tutoring --only firestore,auth "npx vitest run --config vitest.handlers.config.js"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      # VITE_* are inlined into the browser bundle, so they are public by
      # construction and live in repository VARIABLES (Settings -> Secrets and
      # variables -> Actions -> Variables), not secrets. Without them the build
      # succeeds but the app has no Firebase config, so a master build refuses.
      - name: Require the Firebase web config on master
        if: github.event_name == 'push'
        run: |
          if [ -z "${{ vars.VITE_FIREBASE_API_KEY }}" ] || [ -z "${{ vars.VITE_FIREBASE_PROJECT_ID }}" ]; then
            echo "::error::Repository variables VITE_FIREBASE_* are not set; the deploy artefact would have no Firebase config."
            exit 1
          fi
      - run: npm run build:quiet
        env:
          NODE_ENV: production
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_ENABLE_ANALYTICS: ${{ vars.VITE_ENABLE_ANALYTICS }}
          VITE_LOG_LEVEL: ${{ vars.VITE_LOG_LEVEL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
      # Fails the build on breach, so a bundle regression is caught before merge.
      - run: npm run check:bundle
      # sourcemap:'hidden' emits maps without a sourceMappingURL comment. They
      # never ship.
      - name: Strip source maps from the deploy artefact
        run: |
          find dist -name '*.map' -type f -delete
          echo "Remaining .map files: $(find dist -name '*.map' | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
