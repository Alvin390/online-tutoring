name: CI

# Phase 13 / 01 D1. Replaces deploy.yml, which still deployed to Vercel and ran
# the handler suite without the Auth emulator or a project ID — authParity could
# not pass in CI (validated: every case failed on a verbatim replay).
#
# Jobs run in parallel where they share nothing. Deployment to Cloudflare UPLOADS
# a version from master but does not route traffic to it — that matches
# `npm run deploy` and keeps promotion a deliberate human step:
#   npx wrangler versions deploy        (or one click in the Cloudflare dashboard)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Read by scripts/postinstall.js — CI installs must not run the health check
  # and a full production build as a side effect of `npm ci`.
  CI: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run test:all

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Cache Firebase emulator JARs
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Security rules are the only control a client cannot bypass.
      - run: npx firebase-tools emulators:exec --project demo-online-tutoring --only firestore "npx vitest run --config vitest.rules.config.js"

  handlers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Cache Firebase emulator JARs
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # BOTH emulators and an explicit demo project. Without --project the Auth
      # emulator mints tokens for "demo-no-project", which the REST shim then
      # (correctly) rejects — see tests/handlers/authParity.test.js.
      - run: npx firebase-tools emulators:exec --project demo-online-tutoring --only firestore,auth "npx vitest run --config vitest.handlers.config.js"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run build:quiet
        env:
          NODE_ENV: production
      # Fails the build on breach, so a bundle regression is caught before merge.
      - run: npm run check:bundle
      # sourcemap:'hidden' emits maps without a sourceMappingURL comment. They
      # never ship.
      - name: Strip source maps from the deploy artefact
        run: |
          find dist -name '*.map' -type f -delete
          echo "Remaining .map files: $(find dist -name '*.map' | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Pull requests: upload a preview version (no traffic) so the PR has a URL.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [lint, unit, rules, handlers, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --message "PR #${{ github.event.pull_request.number }}"

  # master: upload a version. Promotion stays manual (see header).
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [lint, unit, rules, handlers, audit, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --message "${{ github.sha }}"
