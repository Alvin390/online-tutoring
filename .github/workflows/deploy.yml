name: Deploy to Vercel

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 18 is end-of-life and firebase-admin v13 expects 20+.
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Was `npm run test`, which is bare `vitest` — watch mode. It only
      # terminated because Vitest happens to detect CI. Now explicit.
      - name: Run unit and integration tests
        run: npm run test:all

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Security rules are the only control a client cannot bypass. A rules
      # change without a passing rules test does not merge.
      - name: Run Firestore security rules tests
        run: npx firebase-tools emulators:exec --only firestore "npx vitest run --config vitest.rules.config.js"

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      # sourcemap:'hidden' emits maps without a sourceMappingURL comment. They
      # are useful to Sentry and to nobody else, so they are removed before the
      # deploy step ever sees them.
      - name: Strip source maps from deploy artefact
        run: |
          find dist -name '*.map' -type f -print -delete
          echo "Remaining .map files: $(find dist -name '*.map' | wc -l)"

      - name: Check build output
        run: |
          ls -la dist/
          du -sh dist/

      - name: Deploy to Vercel (Production)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
